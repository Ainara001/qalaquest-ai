services:
  db:
    build: ./db
    image: qalaquest-db:local
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qalaquest}
      POSTGRES_USER: ${POSTGRES_USER:-qalaquest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-qalaquest}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-qalaquest}
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      EMBEDDING_CACHE_DIR: /models
      VALHALLA_URL: http://valhalla:8002
      WEATHER_RULES: ${WEATHER_RULES:-}
      RANKING_WEIGHTS: ${RANKING_WEIGHTS:-}
      EVENT_SOURCES: ${EVENT_SOURCES:-}
    volumes:
      - modelcache:/models
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Pedestrian routing: Valhalla built from the OpenStreetMap extract of Kazakhstan (Geofabrik).
  # Download the extract first with ./routing/prepare.sh (resumable); the first start builds routing tiles
  # once (several minutes), later starts reuse them from ./routing/data.
  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:latest
    environment:
      use_tiles_ignore_pbf: "True"
      force_rebuild: "False"
      build_elevation: "False"
      build_admins: "True"
      build_time_zones: "False"
      build_tar: "True"
      server_threads: "2"
    ports:
      - "${VALHALLA_PORT:-8002}:8002"
    volumes:
      - ./routing/data:/custom_files
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8002/status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 60
      start_period: 120s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  modelcache:
